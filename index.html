<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Resolve Master</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <main>
        <div id="gameScreen">
            <div id="topMenu"></div>

            <div id="gameContent">
                <div id="tabArea">
                    <div id="tab1" class="tab _visible">
                        <div id="tab1_divEsq" class="column"></div>
                        <div id="tab1_divCent" class="column">
                            <ul class="resourceList"></ul>
                            <ul class="statusList"></ul>
                        </div>
                    </div>

                    <div id="tab2" class="tab">
                        <div id="tab2_divEsq" class="column"></div>
                        <div id="tab2_divCent" class="column">
                            <ul class="statusList purgeStatusList"></ul>
                        </div>
                    </div>

                    <div id="tab3" class="tab">
                        <div id="explorationPreparation">
                            <div id="tab3_divEsq" class="column">
                                <div class="explorationPreparationTitle">Take with you</div>
                                <div id="explorationEssenceSelection" class="explorationLoadoutRow">
                                    <span>Solidified Essence</span>
                                    <div class="explorationAmountControls">
                                        <button id="explorationEssenceDecrease" type="button">−</button>
                                        <span id="explorationEssenceAmount">0.5</span>
                                        <button id="explorationEssenceIncrease" type="button">+</button>
                                    </div>
                                </div>
                                <div id="btn_startExploration" class="interactableButton _visible">Explore</div>
                            </div>
                            <div id="tab3_divCent" class="column"></div>
                        </div>

                        <div id="explorationView" class="column">
                            <div id="explorationFuel">Solidified Essence: 0.0</div>
                            <div id="movementHint">Use arrow keys or WASD to move</div>
                            <div id="explorationMap" aria-label="Exploration map"></div>
                        </div>
                    </div>
                </div>

                <div id="logColumn" class="column">
                    <ul id="loreList" class="loreList"></ul>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="src/main.js"></script>
</body>
</html>
