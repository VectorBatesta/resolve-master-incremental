<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Resolve Master</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <main>
        <div id="gameScreen">
            <div id="topMenu"></div>

            <div id="gameContent">
                <div id="tabArea">
                    <div id="tab1" class="tab _visible">
                        <div id="tab1_divEsq" class="column"></div>
                        <div id="tab1_divCent" class="column">
                            <ul class="resourceList"></ul>
                            <ul class="statusList"></ul>
                        </div>
                    </div>

                    <div id="tab2" class="tab">
                        <div id="tab2_divEsq" class="column"></div>
                        <div id="tab2_divCent" class="column">
                            <ul class="statusList purgeStatusList"></ul>
                        </div>
                    </div>
                </div>

                <div id="logColumn" class="column">
                    <ul id="loreList" class="loreList"></ul>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="src/main.js"></script>
</body>
</html>
